services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control-diario-app
    dns:
      - 168.63.129.16
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: control-diario--backend
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: control_diario
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: control
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
